# Internationalization for the application UI.
#
# The UI ships its English copy inline in the views; this file carries the
# Rails-managed strings — model and attribute names — that surface inside
# validation messages, so a failure reads "Spending cap limit must be greater
# than 0" rather than exposing column names.
#
# See https://guides.rubyonrails.org/i18n.html
en:
  activerecord:
    models:
      scribe_session: "Consultation"
      api_token: "API key"
      usage_limit: "Spending cap"
      form_field: "Field"
    attributes:
      api_token:
        expires_at: "Expiry"
        name: "Name"
      usage_limit:
        limit_value: "Limit"
      account:
        default_callback_url: "Webhook URL"
