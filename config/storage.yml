# Rails parses this whole file whenever Active Storage configures itself, not
# just the entry named by config.active_storage.service. Every credential below
# is therefore read with ENV[...] rather than ENV.fetch(...): a missing AWS key
# must not raise while the app is running on Disk. Otherwise any environment
# without S3 credentials — CI, and the asset-precompile step of the Docker build
# — dies on a service it never uses.
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV["AWS_REGION"] %>
  bucket: <%= ENV["AWS_BUCKET"] %>

spaces:
  service: S3
  access_key_id: <%= ENV["SPACES_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["SPACES_SECRET_ACCESS_KEY"] %>
  region: <%= ENV["SPACES_REGION"] || "blr1" %>
  bucket: <%= ENV["SPACES_BUCKET"] %>
  endpoint: <%= ENV["SPACES_ENDPOINT"] || "https://blr1.digitaloceanspaces.com" %>

minio:
  service: S3
  bucket: <%= ENV["MINIO_BUCKET"] || "application" %>
  endpoint: <%= ENV["MINIO_ENDPOINT"] || "https://localhost:9000" %>
  access_key_id: <%= ENV["MINIO_ACCESS_KEY_ID"] || "minioadmin" %>
  secret_access_key: <%= ENV["MINIO_SECRET_ACCESS_KEY"] || "minioadmin" %>
  region: <%= ENV["MINIO_REGION"] || "us-east-1" %>
  force_path_style: true
